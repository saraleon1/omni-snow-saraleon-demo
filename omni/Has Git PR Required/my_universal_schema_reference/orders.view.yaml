# Reference this view as my_universal_schema_reference__orders
label: Orders
schema_label: ""
#This description was pulled from dbt.
description: Order overview data mart, offering key details for each order
  inlcluding if it's a customer's first order and a food vs. drink item
  breakdown. One row per order.

schema: my_universal_schema_reference
table_name: ORDERS

dimensions:
  order_id:
    sql: '"ORDER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: The unique key of the orders mart.
    primary_key: true

  location_id:
    sql: '"LOCATION_ID"'
    format: ID

  customer_id:
    sql: '"CUSTOMER_ID"'
    format: ID
    #This description was pulled from dbt.
    description: The foreign key relating to the customer who placed the order.

  subtotal_cents:
    sql: '"SUBTOTAL_CENTS"'

  tax_paid_cents:
    sql: '"TAX_PAID_CENTS"'

  order_total_cents:
    sql: '"ORDER_TOTAL_CENTS"'

  subtotal:
    sql: '"SUBTOTAL"'

  tax_paid:
    sql: '"TAX_PAID"'

  order_total:
    sql: '"ORDER_TOTAL"'
    #This description was pulled from dbt.
    description: The total amount of the order in USD including tax.

  ordered_at:
    sql: '"ORDERED_AT"'
    #This description was pulled from dbt.
    description: The timestamp the order was placed at.

  order_cost:
    sql: '"ORDER_COST"'
    #This description was pulled from dbt.
    description: The sum of supply expenses to fulfill the order.

  order_items_subtotal:
    sql: '"ORDER_ITEMS_SUBTOTAL"'

  count_food_items:
    sql: '"COUNT_FOOD_ITEMS"'

  count_drink_items:
    sql: '"COUNT_DRINK_ITEMS"'

  count_order_items:
    sql: '"COUNT_ORDER_ITEMS"'

  is_food_order:
    sql: '"IS_FOOD_ORDER"'
    #This description was pulled from dbt.
    description: A boolean indicating if this order included any food items.

  is_drink_order:
    sql: '"IS_DRINK_ORDER"'
    #This description was pulled from dbt.
    description: A boolean indicating if this order included any drink items.

  customer_order_number:
    sql: '"CUSTOMER_ORDER_NUMBER"'

  order_total_dim:
    # Dimension is defined in the 'orders' dbt semantic model (models/marts/orders.yml)
    sql: ${my_universal_schema_reference__orders.order_total}

  _entity_order_id:
    # Entity is defined in the 'orders' dbt semantic model (models/marts/orders.yml)
    sql: ${my_universal_schema_reference__orders.order_id}
    hidden: true

  _entity_location:
    # Entity is defined in the 'orders' dbt semantic model (models/marts/orders.yml)
    sql: ${my_universal_schema_reference__orders.location_id}
    hidden: true

  _entity_customer:
    # Entity is defined in the 'orders' dbt semantic model (models/marts/orders.yml)
    sql: ${my_universal_schema_reference__orders.customer_id}
    hidden: true

  _filter_new_customer_orders:
    # Produced by the dbt semantic layer integration
    sql: ${my_universal_schema_reference__orders.customer_order_number} = 1
    description: Intermediate filter dimension for measure new_customer_orders
    hidden: true

  _filter_large_orders:
    # Produced by the dbt semantic layer integration
    sql: ${my_universal_schema_reference__orders.order_total_dim} >= 20
    description: Intermediate filter dimension for measure large_orders
    hidden: true

  _filter_food_orders:
    # Produced by the dbt semantic layer integration
    sql: ${my_universal_schema_reference__orders.is_food_order} = TRUE
    description: Intermediate filter dimension for measure food_orders
    hidden: true

  _filter_drink_orders:
    # Produced by the dbt semantic layer integration
    sql: ${my_universal_schema_reference__orders.is_drink_order} = TRUE
    description: Intermediate filter dimension for measure drink_orders
    hidden: true

measures:
  count:
    aggregate_type: count

  order_count:
    # Measure is defined in the 'orders' dbt semantic model (models/marts/orders.yml)
    sql: "1"
    aggregate_type: sum

  new_customer_orders:
    # Measure is defined by the 'new_customer_orders' dbt metric (models/marts/orders.yml)
    sql: "1"
    label: New Customers
    description: New customer's first order count
    aggregate_type: sum
    filters:
      _filter_new_customer_orders:
        is: true

  large_orders:
    # Measure is defined by the 'large_orders' dbt metric (models/marts/orders.yml)
    sql: "1"
    label: Large Orders
    description: Count of orders with order total over 20.
    aggregate_type: sum
    filters:
      _filter_large_orders:
        is: true

  orders:
    # Measure is defined by the 'orders' dbt metric (models/marts/orders.yml)
    sql: "1"
    label: Orders
    description: Count of orders.
    aggregate_type: sum

  food_orders:
    # Measure is defined by the 'food_orders' dbt metric (models/marts/orders.yml)
    sql: "1"
    label: Food Orders
    description: Count of orders that contain food order items
    aggregate_type: sum
    filters:
      _filter_food_orders:
        is: true

  drink_orders:
    # Measure is defined by the 'drink_orders' dbt metric (models/marts/orders.yml)
    sql: "1"
    label: Drink Orders
    description: Count of orders that contain drink order items
    aggregate_type: sum
    filters:
      _filter_drink_orders:
        is: true

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: orders
  target_schema: dbt_sleon_prod
  description: Order overview data mart, offering key details for each order
    inlcluding if it's a customer's first order and a food vs. drink item
    breakdown. One row per order.
  config:
    materialized: table
  code: |-
    with

    orders as (

        select * from {{ ref('stg_orders') }}

    ),

    order_items as (

        select * from {{ ref('order_items') }}

    ),

    order_items_summary as (

        select
            order_id,

            sum(supply_cost) as order_cost,
            sum(product_price) as order_items_subtotal,
            count(order_item_id) as count_order_items,
            sum(
                case
                    when is_food_item then 1
                    else 0
                end
            ) as count_food_items,
            sum(
                case
                    when is_drink_item then 1
                    else 0
                end
            ) as count_drink_items

        from order_items

        group by 1

    ),

    compute_booleans as (

        select
            orders.*,

            order_items_summary.order_cost,
            order_items_summary.order_items_subtotal,
            order_items_summary.count_food_items,
            order_items_summary.count_drink_items,
            order_items_summary.count_order_items,
            order_items_summary.count_food_items > 0 as is_food_order,
            order_items_summary.count_drink_items > 0 as is_drink_order

        from orders

        left join
            order_items_summary
            on orders.order_id = order_items_summary.order_id

    ),

    customer_order_count as (

        select
            *,

            row_number() over (
                partition by customer_id
                order by ordered_at asc
            ) as customer_order_number

        from compute_booleans

    )

    select * from customer_order_count
  referenced_by: [ customers, fct_customers ]
